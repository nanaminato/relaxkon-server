name: Deployment smoke tests

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/deployment-smoke.yml'
      - '.github/scripts/deployment-browser-smoke.cjs'
      - 'Dockerfile'
      - '.dockerignore'
      - '.env.example'
      - 'compose.yaml'
      - 'docs/deployment.zh-CN.md'
      - 'global.json'
      - 'src/**'
  workflow_dispatch:

concurrency:
  group: deployment-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Empty SQLite database (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        mode: [compose, systemd]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: matrix.mode == 'systemd'
        with:
          global-json-file: global.json

      - name: Prepare isolated deployment configuration
        shell: bash
        run: |
          umask 077
          cp .env.example .env
          port=6000
          if [[ "${{ matrix.mode }}" == compose ]]; then
            port=6080
            echo 'RELAXKON_IMAGE=relaxkon-local:smoke' >> "$GITHUB_ENV"
            sed -i "s/^RELAXKON_PORT=.*/RELAXKON_PORT=$port/" .env
          fi
          printf 'SMOKE_ORIGIN=http://127.0.0.1:%s\n' "$port" >> "$GITHUB_ENV"
          password=$(openssl rand -hex 10)
          echo "::add-mask::$password"
          printf 'SMOKE_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          for name in Jwt__SecretKey Jwt__RefreshTokenPepper; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            sed -i "s/^$name=.*/$name=$value/" .env
          done

      - uses: actions/checkout@v4
        if: matrix.mode == 'compose'
        with:
          repository: nanaminato/relaxkon-web
          ref: 0637f232a922ae56b6bb6401dda238304f6172e4
          path: frontend
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: matrix.mode == 'compose'
        with:
          node-version: '24'

      - name: Build and stage the Angular application
        if: matrix.mode == 'compose'
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend -- --configuration production
          test -f frontend/dist/app/browser/index.html
          mkdir -p src/RelaxKon.Auth/wwwroot
          cp -R frontend/dist/app/browser/. src/RelaxKon.Auth/wwwroot/

      - name: Build, initialize, and start Docker Compose
        if: matrix.mode == 'compose'
        run: |
          docker build -t "$RELAXKON_IMAGE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          printf 'admin\nadmin@example.com\n%s\n%s\n' "$SMOKE_PASSWORD" "$SMOKE_PASSWORD" |
            docker compose run --rm -T server --init-db
          docker compose up -d

      - name: Publish, initialize, and start systemd service
        if: matrix.mode == 'systemd'
        run: |
          dotnet publish src/RelaxKon.Auth/RelaxKon.Auth.csproj -c Release -o "$RUNNER_TEMP/relaxkon-publish"
          sudo useradd --system --user-group --no-create-home relaxkon
          sudo install -d -m 0755 /opt/relaxkon
          sudo cp -R "$RUNNER_TEMP/relaxkon-publish/." /opt/relaxkon/
          sudo install -d -m 0750 -o relaxkon -g relaxkon /var/lib/relaxkon /etc/relaxkon
          sed 's@/data/@/var/lib/relaxkon/@g' .env >> "$RUNNER_TEMP/server.env"
          printf '\nConnectionStrings__Redis=\nASPNETCORE_URLS=http://127.0.0.1:6000\n' >> "$RUNNER_TEMP/server.env"
          sudo install -m 0600 -o relaxkon -g relaxkon "$RUNNER_TEMP/server.env" /etc/relaxkon/server.env

          dotnet_path=$(command -v dotnet)
          printf 'admin\nadmin@example.com\n%s\n%s\n' "$SMOKE_PASSWORD" "$SMOKE_PASSWORD" |
            sudo -u relaxkon bash -c 'cd /opt/relaxkon && set -a && . /etc/relaxkon/server.env && exec "$1" RelaxKon.Auth.dll --init-db' bash "$dotnet_path"

          sudo tee /etc/systemd/system/relaxkon.service >/dev/null <<EOF
          [Unit]
          Description=RelaxKon Server
          After=network.target

          [Service]
          User=relaxkon
          WorkingDirectory=/opt/relaxkon
          Environment=ASPNETCORE_ENVIRONMENT=Production
          EnvironmentFile=/etc/relaxkon/server.env
          ExecStart=$dotnet_path /opt/relaxkon/RelaxKon.Auth.dll
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
          EOF
          sudo systemctl daemon-reload
          sudo systemctl enable --now relaxkon.service
          systemctl is-active --quiet relaxkon.service

      - name: Sign in and verify administrator privileges
        run: |
          base=$SMOKE_ORIGIN
          curl --silent --show-error --retry 20 --retry-delay 1 --retry-all-errors --max-time 5 "$base/api/role" -o /dev/null
          response=$(printf '{"username":"admin","password":"%s"}' "$SMOKE_PASSWORD" |
            curl --silent --show-error --fail --max-time 5 \
              -H 'Content-Type: application/json' --data-binary @- "$base/api/auth/login")
          token=$(jq -er '.accessToken | strings | select(length > 0)' <<< "$response")
          echo "::add-mask::$token"
          curl --silent --show-error --fail -H "Authorization: Bearer $token" "$base/api/role" |
            jq -e 'any(.[]; .code == "admin")' >/dev/null

      - name: Verify browser sign-in and account management
        if: matrix.mode == 'compose'
        timeout-minutes: 3
        run: |
          browser_tools="$RUNNER_TEMP/deployment-browser"
          npm install --prefix "$browser_tools" --no-audit --no-fund playwright@1.56.1
          NODE_PATH="$browser_tools/node_modules" node .github/scripts/deployment-browser-smoke.cjs

      - name: Push verified image to GHCR and redeploy by digest
        id: registry
        if: matrix.mode == 'compose' && github.repository == 'nanaminato/relaxkon-server' && github.ref == 'refs/heads/master'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry_image=ghcr.io/nanaminato/relaxkon-server
          candidate="$registry_image:sha-$GITHUB_SHA"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$RELAXKON_IMAGE" "$candidate"
          push_log="$RUNNER_TEMP/ghcr-push.log"
          docker push "$candidate" | tee "$push_log"
          digest=$(awk '$2 == "digest:" {print $3}' "$push_log")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          docker compose down
          echo "RELAXKON_IMAGE=$registry_image@$digest" >> "$GITHUB_ENV"
          echo 'COMPOSE_PROJECT_NAME=relaxkon-registry' >> "$GITHUB_ENV"
          echo 'published=true' >> "$GITHUB_OUTPUT"

      - name: Verify the pulled image from a new SQLite volume
        if: steps.registry.outputs.published == 'true'
        run: |
          docker compose pull server
          printf 'admin\nadmin@example.com\n%s\n%s\n' "$SMOKE_PASSWORD" "$SMOKE_PASSWORD" |
            docker compose run --rm -T server --init-db
          docker compose up -d
          curl --silent --show-error --retry 20 --retry-delay 1 --retry-all-errors --max-time 5 \
            "$SMOKE_ORIGIN/api/role" -o /dev/null
          NODE_PATH="$RUNNER_TEMP/deployment-browser/node_modules" node .github/scripts/deployment-browser-smoke.cjs

      - name: Publish latest after registry deployment passes
        if: steps.registry.outputs.published == 'true'
        run: |
          latest=ghcr.io/nanaminato/relaxkon-server:latest
          docker tag "$RELAXKON_IMAGE" "$latest"
          docker push "$latest"
          printf 'Verified image: `%s`\n' "$RELAXKON_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          anonymous_config=$(mktemp -d)
          if docker --config "$anonymous_config" pull "$latest"; then
            echo 'Anonymous GHCR pull succeeded.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Anonymous GHCR pull unavailable. Sign in with an account that can read the package.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show deployment logs on failure
        if: failure()
        env:
          MODE: ${{ matrix.mode }}
        run: |
          if [[ "$MODE" == compose ]]; then
            docker compose ps --all
            docker compose logs --tail=100 server
          else
            sudo journalctl -u relaxkon.service -n 100 --no-pager
          fi
